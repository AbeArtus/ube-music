def fs_decode(fsname, o248):
    from pathlib import Path
    filename = Path.cwd() / fsname
    if not filename.is_file():
        filename.parent.mkdir(parents=True, exist_ok=True)
        with open(fsname,"wb") as fs:
            for input in o248.split("\n"):
                if not input: continue
                fs.write(bytes([ord(c) - 248 for c in input]))

with open("GameState.py","w") as fs:fs.write("""\
from sys import path as syspath
syspath.insert(0, '/Games/CatsEmblem')

print("GameState.py loaded")
from Shared import fetch_level, Cat, Dialog, Menu, Position, Stats, WeaponExp, classEnum, itemDict, get_cat, cat_sprite

_save_data = None

def get_save_data():
    global _save_data
    if _save_data is None:
        import thumbox
        thumbySaveData = thumbox.Thumby().saveData
        thumbySaveData.setName("CatsEmblem")
        _save_data = thumbySaveData
    return _save_data

# --- CONSTANTS ---
SCREEN_TILES_X = 9
SCREEN_TILES_Y = 5

class GameState:
    def __init__(
            self,
            level=None,
            party=None,
            state='title',
        ):
        self.bank = 0
        self.party = party if party else []
        self.selectedCatId: str | None = None
        self.load_level(level)
        self.player_turn = True
        self.cached_domain = None 
        self.combat_log = []
        self.dialog: list[Dialog] = []
        self.state = state
        self.menu = None
        self.lastPos = Position()

    def save_game(self):
        saveData = get_save_data()

        saveData.delItem("gameState-bank")
        saveData.delItem("gameState-level-number")
        saveData.delItem("gameState-party")

        saveData.setItem("gameState-bank", self.bank)
        saveData.setItem("gameState-level-number", self.level.number)
        saveData.setItem("gameState-party", [cat.name for cat in self.party])
        for cat in self.party:
            cat.save_state(saveData)
        saveData.save()

    def load_game(self):
        saveData = get_save_data()
        self.bank = saveData.getItem("gameState-bank")
        
        party_names: list[str] = saveData.getItem("gameState-party")
        
        party = []
        for cat_name in party_names:
            cat_stats = saveData.getItem(f"{cat_name}_stats")
            
            cat_items_names = saveData.getItem(f"{cat_name}_items")
            cat_item_durabilities = saveData.getItem(f"{cat_name}_durabilities")
            
            if len(cat_stats) == 21:
                stats = Stats(
                    attack=cat_stats[0],
                    defense=cat_stats[1],
                    max_hp=cat_stats[2],
                    speed=cat_stats[3],
                    luck=cat_stats[4],
                    range=cat_stats[5],
                )
                
                level = cat_stats[6]
                exp = cat_stats[7]
                next_level_exp = cat_stats[8]
                position = Position(cat_stats[9], cat_stats[10])
                
                items = [itemDict[item_name] for item_name in cat_items_names if item_name in itemDict]
                for i, item in enumerate(items):
                    if item.type == 'weapon' and i < len(cat_item_durabilities):
                        item.durability = cat_item_durabilities.pop(0)

                classType = 'pupil'
                for key, value in classEnum.items():
                    if value == cat_stats[11]:
                        classType = key
                        break
                
                weaponExp = WeaponExp(
                    sword=cat_stats[12],
                    repeater=cat_stats[13],
                    longbow=cat_stats[14],
                    bow=cat_stats[15],
                    lightning=cat_stats[16],
                    water=cat_stats[17],
                    earth=cat_stats[18],
                    mace=cat_stats[19],
                    spear=cat_stats[20]
                )
                
                loadedCat = Cat(
                    sprite=cat_sprite,
                    position=position,
                    name=cat_name,
                    stats=stats,
                    exp=exp,
                    level=level,
                    next_level_exp=next_level_exp,
                    items=items,
                    classType=classType,
                    weaponExp=weaponExp
                )
                party.append(loadedCat)
        
        self.party = party
        
        level_number = saveData.getItem("gameState-level-number")
        self.load_level(fetch_level(level_number))

    def has_saved_game(self):
        saveData = get_save_data()
        return (
            saveData.hasItem("gameState-level-number")
            and saveData.hasItem("gameState-party")
            and saveData.hasItem("gameState-bank")
            ## check that we have the stats and items for each cat in the party
            and all(
                saveData.hasItem(f"{cat_name}_stats") and saveData.hasItem(f"{cat_name}_items") and saveData.hasItem(f"{cat_name}_durabilities")
                for cat_name in saveData.getItem("gameState-party")
            )
        )

    def load_level(self, level=None):
        self.level = None
        self.cached_domain = None
        self.combat_log = []
        self.dialog = []
        self.menu = None
        if level is None:
            return
        for i, p in enumerate(self.party):
            p.set_position(level.startingPositions[i])
            p.restore_state()
        self.level = level
        self.update_selector_position(level.startingPositions[0].x, level.startingPositions[0].y)

    def set_state(self, new_state: str):
        if self.state == 'enemy-turn' and new_state == 'map':
            for unit in self.level.enemies:
                unit.set_exhausted(False)
                unit.set_moved(False)
        elif new_state == 'map':
            self.cancel_cat_select()
        elif new_state == 'enemy-turn':
            for cat in self.party:
                cat.set_exhausted(False)
                cat.set_moved(False)
        self.state = new_state

    def start_game(self):
        self.party = [get_cat()]
        self.load_level(fetch_level(1))

    def load_next_level(self):
        n = self.level.number
        if 1 <= n <= 6:
            self.load_level(fetch_level(n + 1))
            self.save_game()
        elif n == 7 and len(self.party) == 5:
            self.load_level(fetch_level(8))
            self.save_game()
        elif n == 7 or n == 8:
            self.load_level(fetch_level(9))
            self.save_game()
        elif n == 9:
            self.load_level(fetch_level(n + 1))
        elif n == 10:
            self.state = 'end'
        else:
            self.state = 'gameover'

    def add_dialog(self, dialog: 'Dialog'):
        self.dialog.append(dialog)

    def pop_dialog(self):
        if self.dialog:
            self.dialog.pop(0)

    def select_cat(self, cat: Cat):
        selCat = self.get_selected_cat()
        if selCat:
            selCat.set_selected(False)
            selCat.position = self.lastPos.copy()
        self.lastPos = self.level.selectorPosition.copy()
        cat.set_selected(True)
        self.selectedCatId = cat.id

    def cancel_cat_select(self):
        selCat = self.get_selected_cat()
        if selCat:
            selCat.set_selected(False)
            if not selCat.exhausted and selCat.moved and not selCat.enemy:
                selCat.moved = False
                selCat.position = self.lastPos.copy()
                GameState.update_selector_position(self, self.lastPos.x, self.lastPos.y)
        self.cached_domain = None
        self.selectedCatId = None
        self.lastPos = Position()

    def get_selected_cat(self):
        if not self.selectedCatId:
            return None
        enemies = self.level.enemies if self.level else []
        for c in self.party + enemies:
            if c.id == self.selectedCatId:
                return c
        return None

    def find_valid_positions(self, cat: Cat, range_distance: int):
        if not self.level:
            return []
        return self.level.find_valid_positions(cat, range_distance, self.party)

    def end_turn(self):
        self.cancel_cat_select()
        if len(self.level.enemies) == 0:
            for cat in self.party:
                cat.set_exhausted(False)
                cat.set_moved(False)
            self.add_dialog(Dialog(
                lines=["Player Turn"],
                overlay=True,
                timeout=1
            ))
            self.exit_menu()
        elif self.player_turn:
            for cat in self.party:
                cat.set_exhausted(False)
                cat.set_moved(False)
            self.player_turn = False
            self.set_state('enemy-turn')
            self.update_selector_position(self.level.enemies[0].position.x, self.level.enemies[0].position.y)
            self.add_dialog(Dialog(
                lines=[" Enemy Turn"],
                overlay=True,
                timeout=1
            ))
        else:
            for unit in self.level.enemies:
                unit.set_exhausted(False)
                unit.set_moved(False)
            self.player_turn = True
            self.set_state('map')
            self.update_selector_position(self.party[0].position.x, self.party[0].position.y)
            self.add_dialog(Dialog(
                lines=["Player Turn"],
                overlay=True,
                timeout=1
            ))

    def update_selector_position(self, x, y):
        new_x = max(0, min(len(self.level.map[0]) - 1, x))
        new_y = max(0, min(len(self.level.map) - 1, y))
        selCat = self.get_selected_cat()
        if self.state == 'map':
            if selCat and self.cached_domain:
                if (new_x, new_y) not in self.cached_domain:
                    return

            if selCat:
                for blockade in self.level.blockades:
                    if Position(new_x, new_y) in blockade.positions and not blockade.cleared:
                        return

        self.level.selectorPosition.x = new_x
        self.level.selectorPosition.y = new_y

        center_x = SCREEN_TILES_X // 2
        center_y = SCREEN_TILES_Y // 2

        viewport_x = max(0, min(len(self.level.map[0]) - SCREEN_TILES_X, new_x - center_x))
        viewport_y = max(0, min(len(self.level.map) - SCREEN_TILES_Y, new_y - center_y))

        self.level.viewport.x = viewport_x
        self.level.viewport.y = viewport_y

    def units_in_range(self, position: Position, range_distance: int):
        return [u for u in self.party + self.level.enemies
                if abs(u.position.x - position.x) + abs(u.position.y - position.y) <= range_distance]

    def cat_is_on_shop(self):

        for shop in self.level.shops:

        return None

class House:
    __slots__ = ('position', 'dialogs', 'preVisitedDialogs', 'postVisitDialog', 'visitCondition', 'multipleVisits', 'visited', 'destroyed')

    def __init__(
        self,
        position,
        preVisitedDialogs=None,
        dialogs=None,
        postVisitDialog=None,
        visitCondition=None,
        multipleVisits=False,
        destroyed=False
    ):
        self.position = position
        self.dialogs = dialogs if dialogs else []
        self.preVisitedDialogs = preVisitedDialogs if preVisitedDialogs else []
        self.postVisitDialog = postVisitDialog if postVisitDialog else []
        def defaultVisitCondition(): return True
        self.visitCondition = visitCondition if visitCondition else defaultVisitCondition
        self.multipleVisits = multipleVisits
        self.visited = False
        self.destroyed = destroyed

    def visit(self):
        if self.multipleVisits:
            self.visited = False
            return
        self.visited = True

    def can_visit(self):
        if self.destroyed:
            return False
        if self.preVisitedDialogs and not self.visited and not self.visitCondition():
            return True
        if not self.visited and self.visitCondition():
            return True
        if self.visited and self.postVisitDialog:
            return True
        return self.destroyed

    def get_dialogs(self):
        if self.destroyed:
            print("House is destroyed, no dialogs available.")
            return []
        if self.preVisitedDialogs and not self.visited and not self.visitCondition():
            return self.preVisitedDialogs
        if not self.visited and self.visitCondition():
            return self.dialogs
        if self.visited and self.postVisitDialog:
            d = self.postVisitDialog
            return d if isinstance(d, list) else [d]
        return []

    def destroy(self):
        self.destroyed = True
        self.dialogs = []
        self.preVisitedDialogs = []
        self.postVisitDialog = []
        self.visitCondition = lambda: False

        self.unPressAction = unPressAction

        if self.pressed:
            if not self.unPressAction:
                return
            self.unPressAction()
            self.pressed = False
        else:
            if not self.canPress:
                return
            self.pressed = True
            if self.pressAction:

        'startingPositions', 'shops', 'houses', 'conversations', 'buttons', 'blockades', 'overlayObjects'
    )

    def __init__(
        self,
        map,
        enemies,
        number=1,
        seizePosition=Position(1, 1),
        startingPositions=None,
        shops=None,
        houses=None,
        conversations=None,
        buttons=None,
        blockades=None,
        overlayObjects=None
    ):
        self.map = map
        self.enemies = enemies
        self.viewport = Position()
        self.selectorPosition = Position()
        self.number = number
        self.seizePosition = seizePosition
        self.startingPositions = startingPositions if startingPositions else []
        self.shops = shops if shops else []
        self.houses = houses if houses else []
        self.conversations = conversations if conversations else []
        self.buttons = buttons if buttons is not None else []
        self.blockades = blockades if blockades is not None else []
        self.overlayObjects = overlayObjects if overlayObjects is not None else []

    def find_valid_positions(self, cat: Cat, range: int, party: list[Cat]):
        map_width = len(self.map[0])
        map_height = len(self.map)
        cx = cat.position.x
        cy = cat.position.y

        def is_walkable(x, y):
            if not (0 <= x < map_width and 0 <= y < map_height):
                return False
            return self.map[y][x] in canWalkOn

        def get_occupying_unit(x, y):
            for unit in party:
                if unit.id != cat.id and unit.position.x == x and unit.position.y == y:
                    return unit
            for unit in self.enemies:
                if unit.id != cat.id and unit.position.x == x and unit.position.y == y:
                    return unit
            return None

        def is_barrier(x, y):
            for blockade in self.blockades:
                if not blockade.cleared:
                    for pos in blockade.positions:
                        if pos.x == x and pos.y == y:
                            return True
            return False

        # Single dict replaces both visited set and string-keyed position_weight dict.
        # Tracks best remaining_range seen per (x, y); skip re-processing if not improved.
        position_weight = {}
        valid_positions = set()
        queue = [(cx, cy, range)] 

        while queue:
            x, y, rem = queue.pop()

            if not is_walkable(x, y):
                continue
            elif is_barrier(x, y):
                continue

            key = (x, y)
            position_weight[key] = rem
            occupying_unit = get_occupying_unit(x, y)
            occupied_by_enemy = occupying_unit is not None and occupying_unit.enemy != cat.enemy
            occupied_by_ally = occupying_unit is not None and occupying_unit.enemy == cat.enemy

            if occupied_by_enemy:
                continue
            elif not occupied_by_ally or (occupied_by_ally and not cat.enemy) or (x == cx and y == cy):
                valid_positions.add((x, y))

            if rem > 0:
                for dx, dy in [(-1, 0), (1, 0), (0, -1), (0, 1)]:
                    nx, ny = x +dx, y + dy
                    nkey = (nx, ny)
                    encumbernce = tileEncumberence.get(self.map[y][x], 1)
                    if nkey not in position_weight or rem - encumbernce > position_weight[nkey]:
                        queue.append((nx, ny, rem - encumbernce))

        return list(valid_positions)

def fetch_level(level_number):
    import sys
    from Callbacks import CALLBACKS
    if level_number < 6:
        sys.modules.pop('ActTwo', None)
        from ActOne import ActOneLevels, set_game_state_callbacks
        set_game_state_callbacks(*CALLBACKS)
        builder = (
            ActOneLevels._build_level1, ActOneLevels._build_level2, ActOneLevels._build_level3,
            ActOneLevels._build_level4, ActOneLevels._build_level5
        )[level_number - 1]
        level = builder()
        return level
    sys.modules.pop('ActOne', None)
    from ActTwo import ActTwoLevels, set_game_state_callbacks
    set_game_state_callbacks(*CALLBACKS)
    builder = (
        ActTwoLevels._build_level6, ActTwoLevels._build_level7, ActTwoLevels._build_level8,
        ActTwoLevels._build_level9, ActTwoLevels._build_level10
    )[level_number - 6]
    level = builder()
    return level

# Shared callbacks between the main game loop and the act level modules.
# Kept tiny so it can be imported by CatsEmblem.py, ActOne.py and ActTwo.py

_game_state = None

def set_game_state(gs):
	global _game_state
	_game_state = gs

def add_to_party(cat):
	_game_state.party.append(cat)

def update_bank(amount):
	_game_state.update_bank(amount)

def give_item(position, item):
	for p in _game_state.party:
		if p.position == position and len(p.items) < 4:
			p.items.append(item)
			return True
	return False

def can_give_item(position):
	for p in _game_state.party:
		if p.position == position and len(p.items) < 4:
			return True
	return False

def get_cat_at_pos(position):
	for p in _game_state.party:
		if p.position == position:
			return p
	return None

def get_selected_cat():
	return _game_state.get_selected_cat()

CALLBACKS = (add_to_party, update_bank, can_give_item, give_item, get_cat_at_pos, get_selected_cat)
""")

            for enemy in self.level.enemies:
                dx = abs(enemy.position.x - selectedCat.position.x)
                dy = abs(enemy.position.y - selectedCat.position.y)
                if (dx + dy) in weapon.get_range():
                    return True
            return False

        validWeapons = [
            (item, i)
            for i, item in enumerate(selectedCat.items)
            if item.type == 'weapon'
            and item.can_use(selectedCat.classType)
            and weapon_in_range(item)
        ]

        self.enter_menu(menu=Menu(
            options=[[
                Option(
                    label= f"{item.name}",
                    action= lambda: (selectedCat.equip_item(i), self.set_state('enemy-select')),
                    condition= lambda: True
                ) for item, i in validWeapons
            ]],
            title=[lambda: f"Pick Weapon"],
            leave_action=exit_menu
        ))


    def seize_action():
        if selectedCat:
            selectedCat.set_exhausted(True)
            selectedCat.set_moved(True)
        self.cancel_cat_select()
        self.state = 'map'
        self.load_next_level()

    def visit_house():
        house = self.cat_is_on_house()
        selCat = self.get_selected_cat()
        houseDialogs = house.get_dialogs()
        for dialog in houseDialogs:
            self.add_dialog(dialog)
        selCat.set_exhausted(True)
        selCat.set_moved(True)
        exit_menu()

    def can_attack():
        cat = self.get_selected_cat()
        if not cat:
            return False
        if cat.exhausted:
            return False
        for enemy in self.level.enemies:
            dx = abs(enemy.position.x - cat.position.x)
            dy = abs(enemy.position.y - cat.position.y)
            for catWeapon in [item for item in cat.items if item.type == 'weapon' and item.can_use(cat.classType)]:
                if catWeapon and dx + dy in catWeapon.get_range():
                    return True
        return False
    
    def check_shop_condition():
        shop = self.cat_is_on_shop()
        selCat = self.get_selected_cat()
        if selCat and selectedCat.exhausted:
            return False
        return shop is not None
    
    def open_shop_action():
        shop = self.cat_is_on_shop()
        if shop:
            self.open_shop_menu(shop)
            self.needsUpdate = True

    def can_talk():
        for conversation in self.level.conversations:       
            if not selectedCat:
                return False
            conversationNames = [conversation.nameOne, conversation.nameTwo]
            unitsInRange = self.units_in_range(selectedCat.position, 1)
            if len(unitsInRange) == 0:
                return False
            firstFound = any(conversationNames[0] == unit.name for unit in unitsInRange)
            secondFound = any(conversationNames[1] == unit.name for unit in unitsInRange)
            if firstFound and secondFound and conversation.condition():
                return True
        return False
    
    def talk_action():
        for conversation in self.level.conversations:
            conversationNames = [conversation.nameOne, conversation.nameTwo]
            unitsInRange = self.units_in_range(self.level.selectorPosition, 1)
            firstFound = [conversationNames[0] == unit.name for unit in unitsInRange]
            secondFound = [conversationNames[1] == unit.name for unit in unitsInRange]
            if firstFound and secondFound:
                for dialog in conversation.dialogs:
                    self.add_dialog(dialog)
                # remove conversation so it can't be triggered again
                self.level.conversations.remove(conversation)
                selectedCat.set_exhausted(True)
                exit_menu()
                break

    def can_press():
        cat = self.get_selected_cat()
        if not cat or cat.exhausted:
            return False
        for button in self.level.buttons:
            if button.position == cat.position and button.can_press():
                return True
        return False

    def press_action():
        cat = self.get_selected_cat()
        if not cat:
            return
        for button in self.level.buttons:
            if button.position == cat.position and button.can_press():
                button.press()
                cat.set_exhausted(True)
                cat.set_moved(True)
                self.add_dialog(Dialog(
                    left_cats=[cat],
                    currentlyTalking=cat.name,
                    lines=["*pressed the", "button*"],
                ))
                selectedCat.set_exhausted(True)
                exit_menu()
                break

    menu_title = f"{selectedCat.name} hp:{selectedCat.hp}" if selectedCat else "Unit Menu"
    self.enter_menu(menu = Menu(
        options=[[
            Option(
                label= "Seize",
                action= seize_action,
                condition= lambda: selectedCat and selectedCat.position == self.level.seizePosition
            ), Option(
                label= "Fight",
                action= fight_action,
                condition= can_attack
            ), Option(
                label="Press",
                action= press_action,
                condition= can_press
            ), Option(
                label= "Move",
                action= move_action,
                condition= can_move
            ), Option(
                label= "Wait",
                action= wait_action,
                condition= lambda: self.get_selected_cat() is not None and not self.get_selected_cat().exhausted
            ), Option(
                label= "Talk",
                action= talk_action,
                condition= can_talk
            ), Option(
                label= "Visit",
                action= visit_house,
                condition= check_house_condition
            ), Option(
                label= "Shop",
                action= open_shop_action,
                condition= check_shop_condition
            ), Option(
                label= "Items",
                action= self.open_item_menu,
                condition= lambda: selectedCat is not None and len(selectedCat.items) > 0
            ), Option(
                label= "Stats",
                action= lambda: self.open_stats(selectedCat),
                condition= lambda: self.selectedCatId is not None
            ), Option(
                label= "End Turn",
                action= self.end_turn,
                condition= lambda: True
            )
        ]],
        title=[lambda: menu_title],
        option_index=option_index,
        leave_action=exit_menu
    ))

def open_stats(self, unit=None):
    if not unit:
        self.state = 'map'
        return

    def close_stats():
        self.state = 'map'
        self.cancel_cat_select()

    stats_options = [
        Option(label=f"lv{unit.level} {unit.classType}", action=lambda: None),
        Option(label=f"hp: {unit.hp}/{unit.stats.max_hp}", action=lambda: None),

    growthRate_options = [

        Option(label=f"hp: {unit.growthRates.max_hp}", action=lambda: None),
        Option(label=f"spd: {unit.growthRates.speed}", action=lambda: None),

        option_index=0,

class Thumby:
    def __init__(self):

    class Sprite:
        def __init__(
            self, width, height, bitmapData, x=0, y=0, key=-1, mirrorX=0, mirrorY=0

            self.mirrorY = mirrorY
            bytes_per_frame = width * ((height + 7) // 8)
            bitmap_length = len(bitmapData[0]) if isinstance(bitmapData, (tuple, list)) and len(bitmapData) == 2 else len(bitmapData)
            self.frameCount = bitmap_length // bytes_per_frame if bytes_per_frame else 0

    class ThumbyGraphics:
        def __init__(self, thumby):

            def __init__(self, thumby):

                self.BLACK = 0

            def _create_screen(self, size, fullscreen=False):
                flags = pygame.RESIZABLE | pygame.DOUBLEBUF
                if fullscreen:
                    flags = pygame.FULLSCREEN | pygame.DOUBLEBUF
                    size = (0, 0)

                if color == 0:
                    return self._black
                if color == 1:
                    return self._white
                if color == 2:
                    gray = int(self._brightness * 0.35)
                    return (gray, gray, gray, 255)
                if color == 3:

                    )

                            for i in range(self.textHeight):
                                for j in range(self.textWidth):
                                    sprite[i][j] = (
                                        self.textBitmap[(i >> 3) * self.textWidth + j]
                                        & (1 << (i & 0x07))

                            for i in range(self.textHeight):
                                for j in range(self.textWidth):
                                    if sprite[i][j]:

                    self._surface.blit(spriteSurface, (x, y))

            def setFont(self, fontFilePath, width, height, space):
                self.textBitmapSource = fontFilePath

                self.textHeight = height
                self.textSpaceWidth = space
                self.textBitmap = bytearray(self.textWidth)
                self.textCharCount = os.stat(self.textBitmapSource)[6] // self.textWidth

            async def update(self):
                import asyncio
                self._thumby._poll_input()
                screen_width, screen_height = self._screen.get_size()
                scale = min(screen_width / self.width, screen_height / self.height)
                target_width = max(1, int(self.width * scale))
                target_height = max(1, int(self.height * scale))
                upscaled_surface = pygame.transform.scale(
                    self._surface, (target_width, target_height)
                )
                self._screen.fill((0, 0, 0))
                self._screen.blit(
                    upscaled_surface,
                    (
                        (screen_width - target_width) // 2,
                        (screen_height - target_height) // 2,

                )

            def setFPS(self, FPS: int = 0) -> None:
                self._fps = max(0, int(FPS))

            def fill(self, color):

            def brightness(self, brightness):

            def setPixel(self, x: int, y: int, color):
                if 0 <= x < self.width and 0 <= y < self.height:

            def getPixel(self, x, y):
                if 0 <= x < self.width and 0 <= y < self.height:
                    pixel = self._surface.get_at((x, y))
                    if pixel[:3] == (0, 0, 0):
                        return 0
                    if pixel[:3] == (self._brightness, self._brightness, self._brightness):

                    if pixel[:3] == (int(self._brightness * 0.35),) * 3:

                    if pixel[:3] == (int(self._brightness * 0.75),) * 3:

            def drawSprite(self, sprite):

                    (sprite.width, sprite.height), pygame.SRCALPHA, 32

                bits_per_byte = 8
                bitmapData = sprite.bitmapData

                bytes_per_frame = sprite.width * ((sprite.height + 7) // 8)

                row_count = (sprite.height + 7) // 8

                            mask_bit = mask_bit | ((mask_byte2 >> bit_index) & 1) << 1
                        color = self._grayColor(bit)
                        mask_color = self._grayColor(mask_bit)

                        if sprite.key == -1 and maskSprite.key == -1:
                            surface.set_at((x, y), color)
                            mask_surface.set_at((x, y), mask_color)
                        elif sprite.key != bit and maskSprite.key != mask_bit:
                            surface.set_at((x, y), color)
                            mask_surface.set_at((x, y), mask_color)

                surface.blit(mask_surface, (0, 0), special_flags=pygame.BLEND_RGBA_MULT)
                self._surface.blit(
                    surface, (sprite.x, sprite.y), (0, 0, sprite.width, sprite.height)
                )

    class ThumbyAudio:
        _MIN_DURATION_MS = 50  # browser audio buffer needs at least ~50ms

        def __init__(self):
            self._freq = 0
            pygame.mixer.quit()
            pygame.mixer.init(frequency=44100, size=-16, channels=2)
            actual_freq, actual_size, actual_channels = pygame.mixer.get_init()
            self._sample_rate = actual_freq
            self._channels = actual_channels
            self._bit_depth = abs(actual_size)
            self._sound_cache = {}
            pygame.mixer.set_num_channels(4)
            self._channel = pygame.mixer.Channel(0)

        def _make_samples(self, freq, duration):
            sample_rate = self._sample_rate
            duration_sec = duration / 1000.0 
            num_samples = max(1, int(sample_rate * duration_sec))

            if self._bit_depth == 16:
                amplitude = 32767
                samples = array.array("h")
            elif self._bit_depth == 8:
                amplitude = 127
                samples = array.array("b")
            else:
                amplitude = 32767
                samples = array.array("h")

            for i in range(num_samples):
                value = int(
                    amplitude * math.sin(2 * math.pi * freq * i / sample_rate)
                )
                for _ in range(self._channels):
                    samples.append(value)
            return samples

        def play(self, freq, duration):
            self._freq = freq
            duration = max(duration, self._MIN_DURATION_MS)
            key = (freq, duration)

            sound = self._sound_cache.get(key)
            if sound is None:
                samples = self._make_samples(freq, duration)
                sound = pygame.mixer.Sound(buffer=samples.tobytes())
                self._sound_cache[key] = sound
            self._channel.play(sound)

        def playBlocking(self, freq, duration):
            self.play(freq, duration)
            while pygame.mixer.get_busy():
                pygame.time.wait(100)

        def stop(self):
            self._channel.stop()

        def setEnabled(self, setting):
            if setting:
                pygame.mixer.unpause()
            else:
                pygame.mixer.pause()

        def set(self, freq):
            self._freq = freq

    class ThumbySaves:
        def __init__(self):
            self.subdirectoryName = None

            self._data = {}

        def setName(self, subdirectoryName):
            os.makedirs("Saves/" + subdirectoryName, exist_ok=True)
            # creates a persistent.json file for save data to Saves/subdirectoryName/persistent.json
            save_path = "Saves/" + subdirectoryName + "/persistent.json"
            if os.path.exists(save_path):
                try:
                    with open(save_path, "r") as f:
                        data = f.read()
                    self._data = json.loads(data) if data else {}
                except (json.JSONDecodeError, OSError):
                    self._data = {}
            else:
                with open(save_path, "w"):
                    pass
                self._data = {}
            self.subdirectoryName = subdirectoryName

        def setItem(self, key, value):
            self._data[key] = value

        def getItem(self, key):
            return self._data[key]

        def hasItem(self, key):
            return key in self._data

        def delItem(self, key):
            if self.hasItem(key):
                del self._data[key]

        def save(self):
            with open("Saves/" + self.subdirectoryName + "/persistent.json", "w+") as f:
                f.write(json.dumps(self._data))

        def getName(self):
            return self.subdirectoryName

def note_to_freq(note_str: str) -> float:
    note_names = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B']
    flat_map = {'Db': 'C#', 'Eb': 'D#', 'Gb': 'F#', 'Ab': 'G#', 'Bb': 'A#'}
    note_str = note_str.strip()
    if note_str[1] in ['#', 'b']:
        pitch = note_str[:2]
        octave = int(note_str[2:])
    else:
        pitch = note_str[:1]
        octave = int(note_str[1:])
    if pitch in flat_map:
        pitch = flat_map[pitch]
    pitch_index = note_names.index(pitch)
    midi_num = (octave + 1) * 12 + pitch_index
    freq = 520 * (2 ** ((midi_num - 69) / 12))
    
    return int(freq)

def get_render_tile_sprite(tile_type: int, map_x: int, map_y: int, screen_x: int, screen_y: int):
	if tile_type == 4 or tile_type == 35:
		return None

	sprite_data, xFlip, yFlip, size_x, size_y = get_tile_data(tile_type)

	if sprite_data is None:
		return None

	if tile_type == 0:
		key = (tile_type, (map_y & 1) == 0)
	elif tile_type == 1:
		xEven = (map_x & 1) == 0
		yEven = (map_y & 1) == 0
		shouldFlip = (xEven and not yEven) or (not xEven and yEven)
		key = (tile_type, shouldFlip)
	else:
		key = (tile_type, xFlip, yFlip)

	sprite = _tile_sprite_cache.get(key)
	if sprite is None:
		if tile_type == 0:
			sprite = thumby.Sprite(size_x, size_y, sprite_data, 0, 0, -1, key[1])
		elif tile_type == 1:
			sprite = thumby.Sprite(size_x, size_y, sprite_data, 0, 0, -1, key[1])
		else:
			sprite = thumby.Sprite(size_x, size_y, sprite_data, 0, 0, -1, xFlip, yFlip)
		_tile_sprite_cache[key] = sprite

	sprite.x = screen_x * 8
	sprite.y = screen_y * 8
	return sprite

def battle(attacker: Cat, defender: Cat):
	global gameState

	attackerExp = 0
	defenderExp = 0

	expMultiplier = defender.level / attacker.level if defender.enemy else attacker.level / defender.level

	attackerExp += record_attack(attacker, defender)
	if defender.hp <= 0:
		attacker.add_exp(int(defender.stats.max_hp * expMultiplier), addDialog)
		return

	defender_weapon = defender.get_weapon()
	defender_ranges = defender_weapon.get_range() if defender_weapon else []
	dx = abs(attacker.position.x - defender.position.x)
	dy = abs(attacker.position.y - defender.position.y)
	if dx + dy in defender_ranges:
		defenderExp += record_attack(defender, attacker)
		if attacker.hp <= 0:
			defender.add_exp(int(attacker.stats.max_hp * expMultiplier), addDialog)
			return

	if attacker.stats.speed * int(1.5) > defender.stats.speed:
		attackerExp += record_attack(attacker, defender, is_counter=True)
	if defender.hp <= 0:
		attacker.add_exp(int(defender.stats.max_hp * expMultiplier), addDialog)
		return

	if dx + dy in defender_ranges:
		if defender.stats.speed * int(1.5) > attacker.stats.speed:
			attackerExp += record_attack(defender, attacker, is_counter=True)
		if attacker.hp <= 0:
			defender.add_exp(int(attacker.stats.max_hp * expMultiplier), addDialog)
			return

	defender.add_exp(defenderExp, addDialog)
	attacker.add_exp(attackerExp, addDialog)
	
def record_attack(attacker: Cat, defender: Cat, is_counter: bool = False) -> int:
	global gameState
	import random
	attackerWeapon = attacker.get_weapon()

	if attackerWeapon is None:
		return 0

	randInt = random.randint(1, 100)

	tileEvationBonus = tileEvation.get(gameState.level.map[defender.position.y][defender.position.x], 0)

	defenderDodge = defender.stats.defense + defender.stats.speed + defender.stats.luck
	attackerAttackPower = attacker.stats.speed + attacker.stats.luck + attacker.stats.attack
	attackDodge = randInt < (defenderDodge - attackerAttackPower) * 3
	randInt = random.randint(1, 100)
	attackHit = randInt <= attackerWeapon.accuracy - tileEvationBonus

	damage = calculate_damage(attacker, defender) if attackHit and not attackDodge else 0
	old_hp = defender.hp
	new_hp = old_hp - damage

	log = AttackLog(
		attacker_name=attacker.name,
		attacker_hp=attacker.hp,
		attacker_max_hp=attacker.stats.max_hp,
		attacker_enemy=attacker.enemy,
		attacker_sprite=attacker.sprite,
		defender_name=defender.name,
		defender_hp=defender.hp,
		defender_max_hp=defender.stats.max_hp,
		defender_enemy=defender.enemy,
		defender_sprite=defender.sprite,
		damage=damage,
		old_hp=old_hp,
		new_hp=new_hp,
		miss=not attackHit,
		dodge=attackDodge,
		text=f"{'' if attackHit else 'miss'}",
		static_render_time= 3 if not attackHit or attackDodge or damage == 0 else 1
	)

	gameState.combat_log.append(log)

	defender.set_hp(new_hp)

	if defender.hp <= 0:
		if defender in gameState.level.enemies:
			gameState.level.enemies.remove(defender)
			additionalChance = attacker.stats.luck + attacker.stats.speed + attacker.stats.attack - defender.stats.luck - defender.stats.speed - defender.stats.defense
			randInt = random.randint(1, 100)
			attackingInRange = attackerWeapon.range == 1
			if randInt <= (40 + additionalChance) and attackingInRange:
				gold = random.randint(1, int(defender.level * 1.5))
				gameState.add_dialog(Dialog(
					lines=[f"Looted {gold} ", "gold!"],
					lambda_after=lambda: gameState.update_bank(gold)
				))
		if defender in gameState.party:
			gameState.party.remove(defender)
	expMultiplier = defender.level / attacker.level

	return max(int(damage * expMultiplier + 0.49), 1)

def calculate_damage(attacker: Cat, defender: Cat):
	global gameState
	import random
	attackerWeapon: Item = attacker.get_weapon()
	defenderWeapon: Item = defender.get_weapon()

	party = gameState.party if not attacker.enemy else gameState.level.enemies
	assist = 0
	for member in party :
		if abs(member.position.x - attacker.position.x) + abs(member.position.y - attacker.position.y) <= 1:
			assist += 5

	if attackerWeapon is None:
		return 0

	hasWeaponAdvantage = attackerWeapon and defenderWeapon and weaponAdvantages.get(attackerWeapon.type) == defenderWeapon.type or attackerWeapon is not None and defenderWeapon is None
	hasClassAdvantage = classAdvantages.get(attacker.classType) == defender.classType
	defenderHasWeaponAdvantage = attackerWeapon and defenderWeapon and weaponAdvantages.get(defenderWeapon.type) == attackerWeapon.type or attackerWeapon is None and defenderWeapon is not None
	defenderHasClassAdvantage = classAdvantages.get(defender.classType) == attacker.classType
	attackerLowHP = attacker.hp <= attacker.stats.max_hp // 4
	defenderLowHP = defender.hp <= defender.stats.max_hp // 4

	attacker.weaponExp.increase_exp(attackerWeapon.weaponType, 1)

	base_damage = attacker.stats.attack + attacker.get_weapon().attack - defender.stats.defense
	bonus_damage = 0 + attacker.weaponExp.get_weapon_attack_bonus(attackerWeapon.type)
	if hasWeaponAdvantage:
		bonus_damage += int(base_damage * .5)
	if hasClassAdvantage:
		bonus_damage += int(base_damage * .5)

	if defenderHasWeaponAdvantage:
		bonus_damage -= int(base_damage * .5)
	if defenderHasClassAdvantage:
		bonus_damage -= int(base_damage * .5)
		

	crit_chance = (attacker.stats.luck * (1.5 if hasClassAdvantage or hasWeaponAdvantage else 1) * (2 if attackerLowHP else 1) + assist )
	randInt = random.randint(1, 100)
	if randInt < crit_chance or attacker.stats.luck == randInt:
		bonus_damage += base_damage

	destroyed = attackerWeapon.use_weapon()
	if destroyed:
		gameState.add_dialog(Dialog(
			lines=[f"{attacker.name}'s", f"{attackerWeapon.name}", "broke!"],
			lambda_after=None
		))
		attacker.items.remove(attackerWeapon)
	
	return base_damage + bonus_damage if base_damage + bonus_damage > 0 else 1

def handle_movement():
	global gameState

	x = gameState.level.selectorPosition.x
	y = gameState.level.selectorPosition.y
	isCatSelected = gameState.selectedCatId is not None

	directions = {
		"L": (-1, 0),
		"R": (1, 0),
		"U": (0, -1),
		"D": (0, 1)
	}

	for button, (dx, dy) in directions.items():
		if getattr(thumby, f"button{button}").justPressed() or getattr(thumby, f"button{button}").pressed():
			thumby.audio.play(note_to_freq("F#5"), 15)
			new_x, new_y = x + dx, y + dy
			if 0 <= new_y < len(gameState.level.map) and 0 <= new_x < len(gameState.level.map[0]):
				isWalkable = gameState.level.map[new_y][new_x] in canWalkOn
			else:
				isWalkable = False
			for unit in gameState.level.enemies:
				if isCatSelected and unit.id == gameState.selectedCatId:
					continue
				elif unit.position.x == new_x and unit.position.y == new_y:
					isWalkable = False
					break
			canUpdate = isWalkable or gameState.selectedCatId is None
			gameState.update_selector_position(x + (dx if canUpdate else 0), y + (dy if canUpdate else 0))
			return True
	return False

def get_attack_tile(cat: Cat):
	global gameState

	weapon = cat.get_weapon()
	if weapon is None:
		return None, None

	weapon_ranges = weapon.get_range()
	enemy_range = 0 if (cat.aiType == "stand" or cat.moved) else cat.stats.range
	domain = gameState.find_valid_positions(cat, enemy_range)

	potential_targets = []

	for p in gameState.party:
		for pos in domain:
			if abs(pos[0] - p.position.x) + abs(pos[1] - p.position.y) in weapon_ranges:
				diff = cat.level - p.level
				p_weapon = p.get_weapon()
				if p_weapon and weaponAdvantages.get(weapon.type) == p_weapon.type:
					diff += 1
				if classAdvantages.get(cat.classType) == p.classType:
					diff += 1
				potential_targets.append((Position(pos[0], pos[1]), p, diff))
				break

	if not potential_targets:
		for house in gameState.level.houses:
			if house.destroyed or abs(house.position.x - cat.position.x) + abs(house.position.y - cat.position.y) > cat.stats.range:
				continue
			for pos in domain:
				if pos[0] == house.position.x and pos[1] == house.position.y:
					potential_targets.append((Position(pos[0], pos[1]), None, 0))
					break

	if not potential_targets and cat.aiType == "path" and cat.aiPath and not cat.moved:
		nearest_path_point = {"position": None, "distance": float('inf')}
		for pathPos in cat.aiPath:
			if pathPos.visited:
				continue
			pos = pathPos.position
			distance = abs(pos.x - cat.position.x) + abs(pos.y - cat.position.y)
			if distance < nearest_path_point["distance"]:
				if cat.position.x == pos.x and cat.position.y == pos.y:
					pathPos.mark_visited()
					continue
				nearest_path_point = {"position": pos, "distance": distance}
		if nearest_path_point["position"]:
			target = nearest_path_point["position"]
			closest = min(domain, key=lambda pos: abs(pos[0] - target.x) + abs(pos[1] - target.y), default=None)
			if closest:
				potential_targets.append((Position(closest[0], closest[1]), None, 0))
					
	if not potential_targets and cat.aiType == "omnipresence" and not cat.moved:
		target_pos = gameState.party[0].position
		closest = min(domain, key=lambda pos: abs(pos[0] - target_pos.x) + abs(pos[1] - target_pos.y), default=None)
		if closest:
			potential_targets.append((Position(closest[0], closest[1]), None, 0))

	if not potential_targets:
		return None, None

	best_position, best_target, _ = max(potential_targets, key=lambda t: t[2])
	return best_position, best_target

# --- MAIN LOOP ---

async def main():
	global frame, activeEnemy, readyForBattle, option, current_hp_display, currentFont
	while True:
		frame += 1


		partyFullyExhausted = all(p.exhausted for p in gameState.party) if gameState.party else None
		if (gameState.state == 'map' or gameState.state == 'enemy-turn' or gameState.state == 'enemy-select')\
		and not len(gameState.dialog) > 0 and not len(gameState.combat_log) > 0:
			if currentFont == "5x7":
				currentFont = "3x5"
				thumby.display.setFont("./font3x5.bin", 3, 5, 1)
			render_map(gameState.level.map)
		else:
			if currentFont == "3x5":
				currentFont = "5x7"
				thumby.display.setFont("./font5x7.bin", 5, 7, 1)

		if gameState.level != None and not any(p.name == 'cat' for p in gameState.party):
			gameState.state = 'gameOver'

		if len(gameState.combat_log) > 0:
			thumby.display.fill(thumby.display.WHITE)
			if (current_hp_display == - 1):
				current_hp_display = gameState.combat_log[0].defender_hp
			log: AttackLog = gameState.combat_log[0]
			attackerHealth = log.attacker_hp
			defenderHealth = current_hp_display
			attackRange = current_hp_display == gameState.combat_log[0].defender_hp - 1
			beep = current_hp_display < gameState.combat_log[0].defender_hp
			cat = 4 if attackRange else 0

			# Display based on who is attacking (party is always on the right, enemy always on the left)
			middleOfScreen = 36
			enemyAttacking = log.attacker_enemy
			margin = 1 if enemyAttacking else 2
			attacker_offset = 0 if enemyAttacking else middleOfScreen
			defender_offset = middleOfScreen - attacker_offset

			thumby.display.drawText(log.attacker_name, 2 if enemyAttacking else 40, 24, thumby.display.BLACK)
			draw_health_bar(attackerHealth, log.attacker_max_hp, attacker_offset, margin)
			thumby.display.drawText(log.defender_name, 40 if enemyAttacking else 2, 24, thumby.display.DARKGRAY)
			draw_health_bar(defenderHealth, log.defender_max_hp, defender_offset, margin)

			if beep:
				damage_x = 71 - (len(str(log.damage)) + 1) * 6 if enemyAttacking else 2
				thumby.display.drawText(f"-{log.damage}", damage_x, 2, thumby.display.LIGHTGRAY)

			# render the cats
			log.attacker_sprite.x = 8 + cat if enemyAttacking else 56 - cat
			log.attacker_sprite.y = 8
			thumby.display.drawSprite(log.attacker_sprite)
			log.defender_sprite.x = 56 if enemyAttacking else 8
			log.defender_sprite.y = 8
			thumby.display.drawSprite(log.defender_sprite)
			if (log.miss or log.dodge):
				if log.static_render_time == 3:
					if (frame % 2 == 1): thumby.audio.play(note_to_freq("C5" if enemyAttacking else "G#4"), 40)
				thumby.display.drawText('dodge' if log.dodge else 'miss', 40 if enemyAttacking else 8, 16, thumby.display.BLACK)

			# Animate HP counting down
			if (frame % 2 == 1): 
				if log.static_render_time > 0:
					log.static_render_time -= 1
				elif current_hp_display <= gameState.combat_log[0].new_hp or current_hp_display <= 0:
					gameState.combat_log.pop(0)
					if len(gameState.combat_log) > 0:
						current_hp_display = gameState.combat_log[0].old_hp
				else:
					current_hp_display = current_hp_display - 1
					thumby.audio.play(note_to_freq("Eb5" if enemyAttacking else "C#5"), 10)
			if len(gameState.combat_log) == 0:
				current_hp_display = -1

		elif len(gameState.dialog) > 0:
			dialog = gameState.dialog[0]

			if not dialog.overlay:
				thumby.display.fill(thumby.display.WHITE)
			else:
				render_map(gameState.level.map)
				thumby.display.drawFilledRectangle(0, 14, 72, 10, thumby.display.WHITE)
				thumby.display.drawLine(0, 24, 72, 24, thumby.display.BLACK)

			thumby.display.drawLine(0, 14, 72, 14, thumby.display.BLACK)

			portrait = get_dialog_portrait_sprite()
			yOffset = 1
			xOffset = 4
			for cat in dialog.left_cats:
				portrait.x = xOffset
				portrait.y = yOffset
				thumby.display.drawSprite(portrait)
				if cat and cat.name == dialog.currentlyTalking:
					thumby.display.drawLine(xOffset + 3, yOffset +12, xOffset + 5, yOffset + 10, thumby.display.BLACK)
					thumby.display.drawLine(xOffset + 5, yOffset + 10, xOffset + 7, yOffset + 12, thumby.display.BLACK)
					thumby.display.drawLine(xOffset + 3, yOffset + 13, xOffset + 8,  yOffset + 13, thumby.display.WHITE)
				xOffset += 10
			xOffset = 62
			for cat in dialog.right_cats:
				portrait.x = xOffset
				portrait.y = yOffset
				thumby.display.drawSprite(portrait)
				if cat and cat.name == dialog.currentlyTalking:
					thumby.display.drawLine(xOffset + 3, yOffset +12, xOffset + 5, yOffset + 10, thumby.display.BLACK)
					thumby.display.drawLine(xOffset + 5, yOffset + 10, xOffset + 7, yOffset + 12, thumby.display.BLACK)
					thumby.display.drawLine(xOffset + 3, yOffset + 13, xOffset + 8,  yOffset + 13, thumby.display.WHITE)
				xOffset -= 10
			yOffset = 16

			for line in dialog.lines:
				thumby.display.drawText(line, 1, yOffset, thumby.display.BLACK)
				yOffset += 8

			if dialog.timeout:
				thumby.display.update()
				await asyncio.sleep(dialog.timeout)
				gameState.pop_dialog()
			else:
				if thumby.buttonA.justPressed():
					thumby.audio.play(note_to_freq("C#6"), 20)
					if dialog.lambda_after:
						dialog.lambda_after()
					gameState.pop_dialog()
				if dialog.decision and thumby.buttonB.justPressed():
					thumby.audio.play(note_to_freq("C6"), 20)
					gameState.pop_dialog()

		elif partyFullyExhausted is not None and partyFullyExhausted and gameState.player_turn and gameState.state == 'map':
			thumby.audio.play(note_to_freq("Ab5"), 100)
			gameState.end_turn()

		elif gameState.state == 'title':
			thumby.display.fill(thumby.display.WHITE)
			thumby.display.drawText("Cats Emblem", 3, 4, thumby.display.BLACK)
			thumby.display.drawSprite(cat_head(16, 14))

			if thumby.buttonA.justPressed():
				thumby.audio.play(note_to_freq("F#6"), 20)
				def load_game_action():
					from Shared import release_title_sprites
					if gameState.has_saved_game():
						release_title_sprites()
						gameState.load_game()
						gameState.state = 'map'
				def new_game_action():
					from Shared import release_title_sprites
					release_title_sprites()
					gameState.start_game()
					gameState.state = 'map'
				title_menu = Menu(
					options=[[
						Option(label="New Game", action=new_game_action),
						Option(label="Load Game", action=load_game_action, condition=lambda: gameState.has_saved_game())
					]],
					title=[lambda: "Main Menu"],
					leave_action=lambda: setattr(gameState, 'state', 'title')
				)
				gameState.enter_menu(title_menu)

		elif gameState.state == 'map':
			moved = handle_movement()
			if (frame % 5 == 0): animate_cats()

			if thumby.buttonA.justPressed():
				thumby.audio.play(note_to_freq("A#5"), 20)
				cat_here = None
				enemy_here = None
				for c in gameState.party:
					if c.position == gameState.level.selectorPosition:
						cat_here = c
						break
				for e in gameState.level.enemies:
					if e.position == gameState.level.selectorPosition:
						enemy_here = e
						break
				if cat_here and cat_here.id != gameState.selectedCatId:
					if cat_here.exhausted:
						gameState.select_cat(cat_here)
						gameState.open_unit_menu()
					else:
						gameState.select_cat(cat_here)
						gameState.cached_domain = gameState.find_valid_positions(cat_here, cat_here.stats.range)
				elif gameState.selectedCatId != None:
					cat = gameState.get_selected_cat()
					if cat:
						cat.set_position(Position(gameState.level.selectorPosition.x, gameState.level.selectorPosition.y))
						cat.moved = True
						gameState.open_unit_menu()
				elif enemy_here:
					if enemy_here.position == gameState.level.selectorPosition:
						gameState.selectedCatId = enemy_here.id
						gameState.open_stats(enemy_here)
				else:
					gameState.open_unit_menu()

			if thumby.buttonB.justPressed():
				thumby.audio.play(note_to_freq("G#5"), 20)
				if gameState.selectedCatId is not None:
					gameState.cancel_cat_select()
				else:
					# cycle through party memebers
					active_cats = [c for c in gameState.party if not c.moved and not c.exhausted]

					if len(active_cats) > 0:
						current_index = -1
						for i, c in enumerate(gameState.party):
							if c.position == gameState.level.selectorPosition:
								current_index = i
								break
						next_index = (current_index + 1) % len(active_cats)
						next_cat = active_cats[next_index]
						gameState.update_selector_position(next_cat.position.x, next_cat.position.y)

		elif gameState.state == 'menu':
			if gameState.menu:
				thumby.display.fill(thumby.display.WHITE)
				
				if gameState.menu.title and gameState.menu.menu_index < len(gameState.menu.title):
					thumby.display.drawText(gameState.menu.title[gameState.menu.menu_index](), 2, 0, thumby.display.DARKGRAY)
		
				visible_options, offset = gameState.menu.get_visible_options()
				for i, menu_option in enumerate(visible_options):
					selected = thumby.display.BLACK if i + offset == gameState.menu.option_index else thumby.display.DARKGRAY
					if i + offset == gameState.menu.option_index:
						thumby.display.drawRectangle(71, 9 + i * 8, 1, 5, thumby.display.BLACK)
						thumby.display.drawRectangle(70, 10 + i * 8, 1, 3, thumby.display.BLACK)
						thumby.display.drawRectangle(69, 11 + i * 8, 1, 1, thumby.display.BLACK)
						thumby.display.drawRectangle(0, 8 + i * 8, 1, 7, thumby.display.BLACK)
					thumby.display.drawText(menu_option.label, 2, 8 + i * 8, selected)

				visible_options = gameState.menu.get_options()
				button_pressed = False
				if thumby.buttonU.justPressed() and gameState.menu.option_index > 0:
					gameState.menu.option_index -= 1
					thumby.audio.play(note_to_freq("F#5"), 15)
				elif thumby.buttonD.justPressed() and gameState.menu.option_index < len(visible_options) - 1:
					gameState.menu.option_index += 1
					thumby.audio.play(note_to_freq("F#5"), 15)
		
				elif thumby.buttonL.justPressed() and gameState.menu.menu_index > 0:
					gameState.menu.menu_index -= 1
					gameState.menu.option_index = 0
					thumby.audio.play(note_to_freq("F5"), 15)
		
				elif thumby.buttonR.justPressed() and gameState.menu.menu_index < len(gameState.menu.options) - 1:
					gameState.menu.menu_index += 1
					gameState.menu.option_index = 0
					thumby.audio.play(note_to_freq("F5"), 15)
		
				elif thumby.buttonA.justPressed():
					thumby.audio.play(note_to_freq("C#6"), 15)
					valid_options = gameState.menu.get_options()
					if valid_options:
						valid_options[gameState.menu.option_index].action()
					
				elif thumby.buttonB.justPressed():
					thumby.audio.play(note_to_freq("G#6"), 15)
					if gameState.menu.leave_action:
						gameState.menu.leave_action()

		elif gameState.state == 'enemy-select':
			selected_cat = gameState.get_selected_cat()
			enemies_in_range = []

			sel_cat_weapon = selected_cat.get_weapon()
			if selected_cat:
				for enemy in gameState.level.enemies:
					dx = abs(enemy.position.x - selected_cat.position.x)
					dy = abs(enemy.position.y - selected_cat.position.y)
					if dx + dy in sel_cat_weapon.get_range() if sel_cat_weapon is not None else []:
						enemies_in_range.append(enemy)
			if gameState.level.selectorPosition == selected_cat.position and len(enemies_in_range) > 0:
				gameState.update_selector_position(enemies_in_range[0].position.x, enemies_in_range[0].position.y)

			if len(enemies_in_range) == 0:
				gameState.open_unit_menu()
				option = 0
			else:
				if thumby.buttonU.justPressed() or thumby.buttonL.justPressed():
					thumby.audio.play(note_to_freq("C#6"), 20)
					option = (option - 1) % len(enemies_in_range)
					enX = enemies_in_range[option].position.x
					enY = enemies_in_range[option].position.y
					gameState.update_selector_position(enX, enY)
				elif thumby.buttonD.justPressed() or thumby.buttonR.justPressed():
					thumby.audio.play(note_to_freq("C#6"), 20)
					option = (option + 1) % len(enemies_in_range)
					gameState.update_selector_position(enemies_in_range[option].position.x, enemies_in_range[option].position.y)

				if thumby.buttonA.justPressed():
					thumby.audio.play(note_to_freq("F6"), 20)
					selected_enemy = enemies_in_range[option]
					
					battle(selected_cat, selected_enemy)
					selected_cat.set_exhausted(True)
					gameState.cancel_cat_select()
					gameState.selectedCatId = None
					gameState.set_state('map')
				elif thumby.buttonB.justPressed():
					thumby.audio.play(note_to_freq("A#6"), 20)
					if selected_cat: gameState.update_selector_position(selected_cat.position.x, selected_cat.position.y)
					gameState.open_unit_menu()
					option = 0
		
		elif gameState.state == 'enemy-turn':
			if frame % 10 == 1:
				if activeEnemy:
					closest_tile, target = get_attack_tile(activeEnemy)
					if target is None and closest_tile is None:
						readyForBattle = False
						activeEnemy.set_exhausted(True)
						activeEnemy = None

					if target and readyForBattle:
						thumby.audio.play(note_to_freq("Ab5"), 20)
						battle(activeEnemy, target)
						activeEnemy.set_exhausted(True)
						activeEnemy = None
						readyForBattle = False

					elif target and not readyForBattle:
						if closest_tile:
							thumby.audio.play(note_to_freq("Eb5"), 20)
							activeEnemy.set_position(closest_tile)
							activeEnemy.set_moved(True)
							gameState.update_selector_position(closest_tile.x, closest_tile.y)
							readyForBattle = True
					elif closest_tile and not target:
						houseToDestroy = None
						for house in gameState.level.houses:
							if house.position == closest_tile and not house.destroyed:
								houseToDestroy = house
								break
						if houseToDestroy:
							thumby.audio.play(note_to_freq("G4"), 80)	
						else:
							thumby.audio.play(note_to_freq("F5"), 20)
						activeEnemy.set_position(closest_tile)
						activeEnemy.set_moved(True)
						activeEnemy.set_exhausted(True)
						gameState.update_selector_position(closest_tile.x, closest_tile.y)
						activeEnemy = None
				else:
					for e in gameState.level.enemies:
						if not e.exhausted:
							(attackPos, defendingUnit)  = get_attack_tile(e)
							if attackPos != None:
								activeEnemy = e
								gameState.update_selector_position(activeEnemy.position.x, activeEnemy.position.y)
								thumby.audio.play(note_to_freq("Bb5"), 20)
								break
							else:
								readyForBattle = False
								activeEnemy = None
								e.set_exhausted(True)

					if all(e.exhausted for e in gameState.level.enemies):
						thumby.audio.play(note_to_freq("F6"), 100)
						gameState.end_turn()

		elif gameState.state == 'end':
			thumby.display.fill(thumby.display.WHITE)
			thumby.display.drawText("You Win!", 20, 24, thumby.display.BLACK)
			if thumby.buttonA.justPressed():
				thumby.audio.play(note_to_freq("F#6"), 100)
				gameState.cancel_cat_select()
				gameState.set_state('title')

		elif gameState.state == 'gameOver':
			thumby.display.fill(thumby.display.WHITE)
			thumby.display.drawText("Game Over", 15, 24, thumby.display.BLACK)
			if thumby.buttonA.justPressed():
				thumby.audio.play(note_to_freq("F#5"), 100)
				gameState.cancel_cat_select()
				gameState.set_state('title')
		
		await thumby.display.update()


asyncio.run(main())
